<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz – Os Dez Mandamentos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1fa;font-family:system-ui;color:#29222f}.app{max-width:720px;margin:auto;min-height:100vh;padding:16px}header{text-align:center;padding:10px}.logo{font-size:48px;color:#5b2a86}h1{margin:6px;color:#4b216f}.sub{color:#706678;font-size:14px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #3b1d5514}.hidden{display:none!important}label{display:block;font-size:13px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:14px;border:2px solid #e8e0ef;border-radius:14px;font-size:16px}.primary,.secondary{width:100%;padding:14px;border-radius:14px;font-weight:850;font-size:16px}.primary{border:0;background:#5b2a86;color:#fff}.secondary{border:2px solid #e3d7eb;background:#fff;color:#5b2a86;margin-top:9px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.feature{background:#faf7fc;border-radius:12px;padding:10px;text-align:center;font-size:12px}.top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#685d70}.timer{color:#5b2a86}.progress{height:8px;background:#eee7f2;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:#7b4aa8}.question{font-size:21px;font-weight:850;line-height:1.35}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e7deec;border-radius:14px;padding:14px;margin:9px 0}.option.selected{border-color:#6f42a5;background:#f3ecfa}.option.correct{border-color:#4d9a63;background:#edf8f0}.option.wrong{border-color:#c65353;background:#fff0f0}.feedback{text-align:center;font-weight:800;min-height:26px}.ok{color:#2d7c47}.bad{color:#b13d3d}.score{text-align:center;font-size:48px;font-weight:950;color:#5b2a86}.certificate{margin-top:18px;border:2px solid #d8c9e8;border-radius:18px;padding:18px;text-align:center;background:#faf6ff}.certname{font-size:24px;font-weight:900;margin:10px}.certdata{line-height:1.7}.footer{text-align:center;font-size:12px;color:#877b8e;padding:18px}@media(max-width:520px){.features{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><div class="logo">✝</div><h1>Quiz – Os Dez Mandamentos</h1><div class="sub">Catequese • 10 perguntas</div></header>
<section id="start" class="card"><h2 style="color:#4b216f">🙏 Pronto para o desafio?</h2><p>Teste seus conhecimentos sobre os Dez Mandamentos da Lei de Deus.</p><label>Nome do participante</label><input id="name" maxlength="80" placeholder="Digite seu nome completo"><button class="primary" style="margin-top:16px" onclick="start()">▶ &nbsp; COMEÇAR</button><div class="features"><div class="feature">🔀<br>Alternativas embaralhadas</div><div class="feature">⏱️<br>Tempo e pontuação</div><div class="feature">📜<br>Certificado</div></div></section>
<section id="quiz" class="card hidden"><div class="top"><span id="num"></span><span id="pts"></span><span id="clock">00:00</span></div><div class="progress"><div id="bar"></div></div><div id="q" class="question"></div><div id="opts"></div><div id="fb" class="feedback"></div><button id="confirm" class="primary hidden" onclick="confirmAnswer()">✓ CONFIRMAR RESPOSTA</button><button id="next" class="primary hidden" onclick="nextQuestion()">PRÓXIMA</button></section>
<section id="result" class="card hidden"><h2 style="text-align:center;color:#4b216f">🏆 Resultado</h2><div id="score" class="score"></div><p id="msg" style="text-align:center"></p><div id="cert"></div><button class="primary" onclick="start()">JOGAR NOVAMENTE</button><button class="secondary" onclick="home()">VOLTAR AO INÍCIO</button></section>
<div class="footer">Conhecer a Palavra, viver a fé ✝</div></div>
<script>
const data=[{"q": "Quantos são os Mandamentos da Lei de Deus?", "a": ["5", "10", "12", "7"], "correct": 1}, {"q": "Qual é o primeiro mandamento?", "a": ["Não matar", "Amar a Deus sobre todas as coisas", "Honrar pai e mãe", "Não furtar"], "correct": 1}, {"q": "O que significa amar a Deus sobre todas as coisas?", "a": ["Colocar Deus em primeiro lugar na nossa vida", "Ir à igreja somente quando queremos", "Pensar apenas em nós mesmos", "Colocar os bens materiais acima de Deus"], "correct": 0}, {"q": "O que devemos evitar quando dizemos: “Não tomar seu santo nome em vão”?", "a": ["Rezar", "Usar o nome de Deus sem respeito", "Ir à Missa", "Fazer o sinal da cruz"], "correct": 1}, {"q": "Qual mandamento nos ensina a guardar domingos e festas de guarda?", "a": ["O terceiro", "O quinto", "O décimo", "O oitavo"], "correct": 0}, {"q": "O que significa “Honra teu pai e tua mãe”?", "a": ["Respeitar, amar e obedecer aos pais e responsáveis", "Nunca conversar com eles", "Fazer somente o que queremos", "Desobedecer quando não concordamos com eles"], "correct": 0}, {"q": "Qual mandamento diz: “Não matarás”?", "a": ["Quarto", "Quinto", "Sexto", "Segundo"], "correct": 1}, {"q": "Roubar alguma coisa que pertence a outra pessoa vai contra qual mandamento?", "a": ["Não furtar", "Não matar", "Não cobiçar", "Guardar domingos e festas de guarda"], "correct": 0}, {"q": "O que significa não levantar falso testemunho?", "a": ["Não mentir nem acusar injustamente outra pessoa", "Não fazer perguntas", "Não conversar com ninguém", "Nunca dizer o que pensamos"], "correct": 0}, {"q": "O que significa “não cobiçar as coisas alheias”?", "a": ["Ficar feliz com o que temos e não desejar o que pertence ao outro", "Querer tudo que o amigo possui", "Pegar escondido o que queremos", "Comparar nossas coisas com as dos outros para ter mais"], "correct": 0}];
let i=0,score=0,selected=null,answered=false,participant='',startAt=0,elapsed=0,timer=null;
const $=x=>document.getElementById(x);
function show(id){['start','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function tick(){elapsed=Math.floor((Date.now()-startAt)/1000);$('clock').textContent=fmt(elapsed)}
function start(){let n=$('name').value.trim();if(n)participant=n;if(!participant){alert('Digite o nome do participante para iniciar.');$('name').focus();return}i=0;score=0;startAt=Date.now();clearInterval(timer);timer=setInterval(tick,1000);show('quiz');render();tick()}
function render(){selected=null;answered=false;let d=data[i];$('num').textContent='Pergunta '+(i+1)+' de 10';$('pts').textContent='Pontos: '+score;$('bar').style.width=(i/10*100)+'%';$('q').textContent=d.q;$('fb').textContent='';$('fb').className='feedback';$('confirm').classList.add('hidden');$('next').classList.add('hidden');let box=$('opts');box.innerHTML='';shuffle(d.a.map((text,index)=>({text,index}))).forEach((x,n)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+n)+') '+x.text;b.dataset.correct=x.index===d.correct?'1':'0';b.onclick=()=>selectAnswer(b);box.appendChild(b)})}
function selectAnswer(b){if(answered)return;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b;$('confirm').classList.remove('hidden')}
function confirmAnswer(){if(answered||!selected)return;answered=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.correct==='1')b.classList.add('correct')});selected.classList.remove('selected');if(selected.dataset.correct==='1'){score++;selected.classList.add('correct');$('fb').textContent='✓ Correto!';$('fb').className='feedback ok'}else{selected.classList.add('wrong');$('fb').textContent='✗ Quase! A resposta correta está destacada.';$('fb').className='feedback bad'}$('pts').textContent='Pontos: '+score;$('bar').style.width=((i+1)/10*100)+'%';$('confirm').classList.add('hidden');$('next').classList.remove('hidden')}
function nextQuestion(){i++;if(i>=10)finish();else render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function finish(){clearInterval(timer);tick();show('result');$('score').textContent=score+' / 10';$('msg').textContent=score===10?'🌟 Perfeito!':score>=8?'👏 Excelente!':score>=6?'👍 Muito bom!':'📖 Vamos revisar mais um pouco. Você consegue!';let d=new Date().toLocaleDateString('pt-BR');$('cert').innerHTML='<div class="certificate">🏆<h3>Certificado de Participação</h3><div class="certname">'+esc(participant)+'</div><div class="certdata">participou do <b>Quiz – Os Dez Mandamentos</b><br><b>Pontuação:</b> '+score+'/10 • <b>Tempo:</b> '+fmt(elapsed)+'<br><b>Data:</b> '+d+'</div><p><button class="primary" onclick="downloadCert()">⬇ BAIXAR CERTIFICADO</button></p><button class="secondary" onclick="printCert()">🖨 IMPRIMIR / SALVAR EM PDF</button></div>'}
function certHtml(){return '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Certificado</title><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f4eff9;font-family:Georgia,serif}.page{width:85%;padding:70px;text-align:center;background:white;border:10px solid #5b2a86;outline:2px solid #d7c5e8;outline-offset:-22px}h1{color:#4b216f;font-size:40px}.name{font-size:38px;font-weight:bold;margin:28px}.data{font:18px system-ui;line-height:1.8}@media print{@page{size:A4 landscape;margin:0}body{background:white}.page{width:100%;height:100vh}}</style><div class="page"><div style="font-size:46px;color:#5b2a86">✝</div><b style="color:#5b2a86">QUIZ – OS DEZ MANDAMENTOS</b><h1>Certificado de Participação</h1><div class="name">'+esc(participant)+'</div><div class="data">Participou do Quiz – Os Dez Mandamentos.<br><b>Pontuação:</b> '+score+'/10 • <b>Tempo:</b> '+fmt(elapsed)+'<br><b>Data:</b> '+new Date().toLocaleDateString('pt-BR')+'<br><br>“Conhecer a Palavra, viver a fé”</div></div></html>'}
function downloadCert(){let u=URL.createObjectURL(new Blob([certHtml()],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='certificado-dez-mandamentos.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function printCert(){let w=open('','_blank');if(!w){alert('Permita pop-ups para imprimir.');return}w.document.write(certHtml());w.document.close();setTimeout(()=>w.print(),400)}
function home(){clearInterval(timer);show('start')}
</script></body></html>
